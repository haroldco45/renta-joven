name: Robot de noticias
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: robot-noticias
  cancel-in-progress: false
jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/actualizar.mjs
      - name: Guardar si hay cambios
        run: |
          git config user.name "Robot Vibras Positivas HM"
          git config user.email "haroldco45@users.noreply.github.com"
          git add data/noticias.json
          git diff --cached --quiet || (git commit -m "Noticias al día" && git pull --rebase && git push)
